<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskly - Plan your day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div class="layout">
    <!-- Side menu: lists -->
    <aside class="side">
      <div class="brand"><span class="logo">✓</span>Taskly</div>
      <nav id="listNav" class="nav"></nav>
      <div class="side-foot">
        <button id="newListBtn" class="link">+ New list</button>
        <button id="themeBtn" class="link">Dark mode</button>
      </div>
    </aside>

    <main class="main">
      <header class="head">
        <div>
          <h1 id="heading">All tasks</h1>
          <p id="today" class="muted"></p>
        </div>
        <button id="openForm" class="primary">+ New task</button>
      </header>

      <!-- Stats + progress -->
      <section class="stats">
        <div class="stat"><b id="sPending">0</b><span>Pending</span></div>
        <div class="stat"><b id="sDone">0</b><span>Completed</span></div>
        <div class="stat late"><b id="sLate">0</b><span>Overdue</span></div>
      </section>
      <div class="progress">
        <p id="progressText" class="muted"></p>
        <div class="bar"><div id="barFill"></div></div>
      </div>

      <input id="search" type="search" class="search" placeholder="Search tasks...">
      <div id="groups"></div>
    </main>
  </div>

  <!-- Popup form: add / edit -->
  <dialog id="dlg">
    <form id="taskForm">
      <h2 id="formTitle">New task</h2>
      <label>Task<input id="title" required maxlength="80" placeholder="e.g. Finish internship report"></label>
      <div class="row">
        <label>Date<input id="date" type="date"></label>
        <label>Time<input id="time" type="time"></label>
      </div>
      <div class="row">
        <label>Priority
          <select id="priority">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label>List<select id="listSelect"></select></label>
      </div>
      <div class="row end">
        <button type="button" id="cancelBtn" class="ghost">Cancel</button>
        <button type="submit" class="primary" id="saveBtn">Add task</button>
      </div>
    </form>
  </dialog>

  <!-- Undo message -->
  <div id="toast" class="toast" hidden>
    <span>Task deleted</span><button id="undoBtn">Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
